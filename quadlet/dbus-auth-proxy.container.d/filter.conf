# Optional: forward to the filtering proxy from dbus-filter.service instead of
# the system bus directly. The base unit's /run/dbus mount stays (quadlet can't
# remove it), but only the proxy itself runs in that container; clients only
# see the dbus-socket volume.
[Unit]
Requires=dbus-filter.service
After=dbus-filter.service

[Container]
Volume=%t/dbus-filter:/run/dbus-filter:rw
Environment=SYSTEM_DBUS=/run/dbus-filter/bus
